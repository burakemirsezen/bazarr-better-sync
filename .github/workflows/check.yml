name: Check experimental application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        asr: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg INSTALL_ASR=${{ matrix.asr }} -t bazarr-better-sync:test .
      - name: Verify CPU-only startup and health
        shell: bash
        run: |
          docker run -d --name sync-test -p 127.0.0.1:8080:8080 bazarr-better-sync:test
          trap 'docker logs sync-test; docker rm -f sync-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
